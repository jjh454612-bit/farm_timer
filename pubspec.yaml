name: farm_timer
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  provider: ^6.1.2
  flutter_background_service: ^5.0.5
  flutter_local_notifications: ^17.2.2
  permission_handler: ^11.3.1
  confetti: ^0.7.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/

  fonts:
    - family: NeoDunggeunmo
      fonts:
        - asset: assets/fonts/NeoDunggeunmoPro-Regular.ttf